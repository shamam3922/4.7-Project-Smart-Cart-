<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Network Connection Test</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="network-test.js"></script>
</head>
<body>
    <header>
        <h1>Network Connection Test</h1>
    </header>

    <main>
        <section class="network-info">
            <p><strong>Local Host Name:</strong> <span id="hostName"></span></p>
            <p><strong>Current Communication Port:</strong> <span id="portNumber"></span></p>
            <p><strong>Current Transmission Protocol:</strong> <span id="protocol"></span></p>
            <p><strong>Last Time Launched:</strong> <span id="launchTime"></span></p>
        </section>
    </main>
</body>
</html>
